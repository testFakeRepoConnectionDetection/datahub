app:
  name: DataHub
  flow-enrichment:
    data-category-field: data_category
  api:
    market-data:
      path: /api/v1/market-data
      data-category: MARKET_DATA
      called-by-application: Trading/Pricing
    risk-market-data:
      path: /api/v1/risk-market-data
      data-category: RISK_MARKET_DATA
      called-by-application: Analytics
    marks:
      path: /api/v1/marks
      data-category: MARK_TO_MARKET
      called-by-application: PNL
  callers:
    - Trading/Pricing
    - Analytics
    - PNL
