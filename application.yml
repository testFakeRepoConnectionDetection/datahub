app:
  name: DataHub
  business_function: MARKET_DATA
  pillar: "Position & Risk"
  flow-enrichment:
    data-field: data
    frequency-field: frequency
  integrations:
    pnl-cashflow:
      base-url: https://pnl.internal/api/v1/cashflows
      target-application: PNL
      connection-kind: API
      channel: /api/v1/cashflows
      data: cashflow
      frequency: daily
    pnl-pv:
      base-url: https://pnl.internal/api/v1/pv
      target-application: PNL
      connection-kind: API
      channel: /api/v1/pv
      data: PV
      frequency: daily
    regulatory:
      base-url: https://regulatory.internal/api/v1/trades
      target-application: Regulatory
      connection-kind: API
      channel: /api/v1/trades
      data: trade
      frequency: daily
  api:
    realtime-pv:
      path: /api/v1/realtime-pv
      called-by-application: Analytics
      connection-kind: API
      data: PV
      frequency: real-time
    eod-trades:
      path: /api/v1/eod-trades
      called-by-application: Booking
      connection-kind: API
      data: trade
      frequency: daily
    eod-cashflows:
      path: /api/v1/eod-cashflows
      called-by-application: Booking
      connection-kind: API
      data: cashflow
      frequency: daily
  callers:
    - Analytics
    - Booking
