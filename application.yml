app:
  name: DataHub
  business_function: MARKET_DATA
  flow-enrichment:
    data-category-field: data_category
  integrations:
    pnl:
      base-url: https://pnl.internal/api/v1/marks
      target-application: PNL
      data-category: MARK_TO_MARKET
      payload-format: JSON
      payload-type: fixture.dto.MarkToMarketDto
    regulatory:
      base-url: https://regulatory.internal/api/v1/instruments
      target-application: Regulatory
      data-category: INSTRUMENT_REFERENCE
      payload-format: JSON
      payload-type: fixture.dto.InstrumentReferenceDto
    accounting:
      base-url: https://accounting.internal/api/v1/valuation-rates
      target-application: Accounting
      data-category: VALUATION_RATES
      payload-format: JSON
      payload-type: fixture.dto.ValuationRatesDto
  api:
    risk-market-data:
      path: /api/v1/risk-market-data
      data-category: RISK_MARKET_DATA
      called-by-application: Analytics
  callers:
    - Analytics
